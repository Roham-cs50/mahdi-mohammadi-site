<!DOCTYPE html><html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مهدی محمدی (Mahdi Mohammadi) | مهندس عمران</title>
<meta name="description" content="مهدی محمدی (Mahdi Mohammadi)، مهندس عمران. رزومه، سوابق کاری، مدارک و مهارت‌ها.">
<meta name="author" content="Mahdi Mohammadi">
<link rel="canonical" href="https://USERNAME.github.io/">
<meta property="og:type" content="profile"><meta property="og:title" content="مهدی محمدی | Mahdi Mohammadi">
<meta property="og:description" content="مهندس عمران؛ رزومه و سوابق کاری">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":"Mahdi Mohammadi","alternateName":"مهدی محمدی","jobTitle":"Civil Engineer","url":"https://USERNAME.github.io/"}</script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FFC62B;--b:#2563EB;--bd:#0B2A6F;--soft:#F4F8FF;--tx:#1b2440}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:var(--tx);background:#fff;overflow-x:hidden;line-height:1.9}
nav{position:fixed;inset:0 0 auto;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 5%;background:#fffd;backdrop-filter:blur(10px);box-shadow:0 1px 0 #2563eb18}
nav b{color:var(--bd);font-weight:800}nav div{display:flex;gap:22px}
nav a{color:var(--tx);text-decoration:none;font-size:14px;position:relative}
nav a:after{content:"";position:absolute;bottom:-2px;right:0;width:0;height:3px;background:var(--y);transition:.35s}
nav a:hover:after{width:100%}
section{padding:100px 8% 40px;max-width:1150px;margin:auto}
h2{font-size:30px;font-weight:800;color:var(--bd);margin-bottom:34px;display:inline-block;background:linear-gradient(var(--y),var(--y)) bottom/100% 10px no-repeat}
#hero{min-height:100vh;display:flex;align-items:center;gap:50px;position:relative;flex-wrap:wrap-reverse;justify-content:center}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;z-index:-1;animation:fl 9s ease-in-out infinite}
.b1{width:340px;height:340px;background:var(--y);top:12%;left:2%}.b2{width:380px;height:380px;background:var(--b);bottom:5%;right:0;animation-delay:-4s}
@keyframes fl{50%{transform:translate(30px,-40px) scale(1.1)}}
.txt{flex:1;min-width:290px;animation:in 1s .1s both}
@keyframes in{from{opacity:0;transform:translateY(40px)}}
.txt small{color:var(--b);font-weight:500}.txt h1{font-size:clamp(38px,7vw,68px);font-weight:800;color:var(--bd);line-height:1.3}
.txt h1 em{display:block;font:500 20px/1.6 sans-serif;color:#6b7aa6;direction:ltr;text-align:right}
.type{font-size:22px;color:var(--b);min-height:44px;font-weight:500}.type:after{content:"|";color:var(--y);animation:bl .8s infinite}
@keyframes bl{50%{opacity:0}}
.btn{display:inline-block;margin:14px 0 0 10px;padding:12px 28px;border-radius:40px;text-decoration:none;font-weight:500;transition:.35s;background:var(--y);color:var(--bd)}
.btn.o{background:none;border:2px solid var(--b);color:var(--b)}.btn:hover{transform:translateY(-5px);box-shadow:0 12px 24px #2563eb30}
.ph{width:min(340px,80vw);aspect-ratio:1;border-radius:42% 58% 55% 45%/50% 45% 55% 50%;background:linear-gradient(135deg,var(--b),var(--y));padding:7px;animation:mo 8s ease-in-out infinite,in 1s both}
@keyframes mo{50%{border-radius:58% 42% 40% 60%/45% 55% 45% 55%}}
.ph>*{width:100%;height:100%;border-radius:inherit;object-fit:cover;background:#fff;display:grid;place-items:center;font-size:110px;font-weight:800;color:var(--b)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:30px}
.stat{flex:1;min-width:120px;text-align:center;padding:20px;border-radius:20px;background:var(--soft);border-bottom:5px solid var(--y);transition:.4s}
.stat:hover{transform:translateY(-8px)}.stat b{font-size:38px;color:var(--b)}
.tl{position:relative;padding-right:34px;border-right:3px solid var(--y)}
.it{position:relative;background:var(--soft);border-radius:18px;padding:20px 24px;margin-bottom:24px;transition:.4s}
.it:before{content:"";position:absolute;right:-46px;top:26px;width:18px;height:18px;border-radius:50%;background:var(--b);border:4px solid #fff;box-shadow:0 0 0 3px var(--y)}
.it:hover{transform:translateX(-10px);box-shadow:0 14px 30px #2563eb1c}.it h3{color:var(--bd)}.it span{color:var(--b);font-size:14px}
.it img,.card img{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-top:12px;cursor:zoom-in}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.card{background:#fff;border:2px solid #e3ebff;border-radius:20px;padding:20px;transition:.4s}
.card:hover{border-color:var(--y);transform:translateY(-8px) rotate(-.6deg);box-shadow:0 16px 30px #ffc62b40}
.sk{margin-bottom:20px}.sk div{display:flex;justify-content:space-between;font-weight:500}
.bar{height:12px;border-radius:9px;background:#e3ebff;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--y),var(--b));transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
#contact{padding-bottom:80px}.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.cg a,.cg div{display:block;padding:22px;border-radius:20px;background:var(--bd);color:#fff;text-decoration:none;transition:.4s}
.cg a:hover,.cg div:hover{background:var(--b);transform:translateY(-6px)}.cg small{color:var(--y);display:block}
.rv{opacity:0;transform:translateY(46px);transition:1s cubic-bezier(.2,.8,.2,1)}.rv.on{opacity:1;transform:none}
#lb{position:fixed;inset:0;background:#0b2a6fe6;display:none;place-items:center;z-index:99;cursor:zoom-out}#lb.on{display:grid}#lb img{max-width:92%;max-height:90%;border-radius:14px;animation:in .4s}
footer{text-align:center;padding:20px;background:var(--soft);font-size:13px;color:#6b7aa6}
@media(max-width:700px){nav div{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style></head><body>
<nav><b id="nb">مهدی محمدی</b><div><a href="#about">درباره من</a><a href="#exp">سوابق</a><a href="#edu">مدارک</a><a href="#skills">مهارت‌ها</a><a href="#contact">تماس</a></div></nav>
<section id="hero"><span class="blob b1"></span><span class="blob b2"></span>
<div class="txt"><small>سلام، من</small><h1 id="nm"></h1><p class="type" id="ty"></p><a class="btn" href="#contact">تماس با من</a><a class="btn o" href="#exp">سوابق کاری</a></div>
<div class="ph" id="ph"></div></section>
<section id="about"><h2 class="rv">درباره من</h2><p class="rv" id="bio"></p><div class="stats rv" id="st"></div></section>
<section id="exp"><h2 class="rv">سوابق کاری</h2><div class="tl" id="ex"></div></section>
<section id="edu"><h2 class="rv">مدارک و گواهینامه‌ها</h2><div class="grid" id="ed"></div></section>
<section id="skills"><h2 class="rv">مهارت‌ها</h2><div id="sk"></div></section>
<section id="contact"><h2 class="rv">تماس با من</h2><div class="cg rv" id="ct"></div></section>
<footer id="ft"></footer><div id="lb"><img alt=""></div>
<noscript><p>Mahdi Mohammadi - مهدی محمدی - مهندس عمران</p></noscript>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img=s=>s?`<img src="${E(s)}" alt="" loading="lazy">`:'';
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{
$('#nb').textContent=d.name;$('#nm').innerHTML=`${E(d.name)}<em>${E(d.nameEn)}</em>`;
document.title=`${d.name} (${d.nameEn}) | ${d.title}`;
$('#ph').innerHTML=d.photo?`<img src="${E(d.photo)}" alt="${E(d.nameEn)}">`:`<div>${E(d.name[0])}</div>`;
$('#bio').textContent=d.bio;
$('#st').innerHTML=(d.stats||[]).map(s=>`<div class="stat"><b data-n="${+s.num}">0</b><br>${E(s.label)}</div>`).join('');
$('#ex').innerHTML=(d.experience||[]).map(x=>`<div class="it rv"><h3>${E(x.title)} — ${E(x.company)}</h3><span>${E(x.period)}</span><p>${E(x.desc)}</p>${img(x.image)}</div>`).join('');
$('#ed').innerHTML=(d.education||[]).map(x=>`<div class="card rv"><h3>${E(x.title)}</h3><p>${E(x.place)} · ${E(x.year)}</p>${img(x.image)}</div>`).join('');
$('#sk').innerHTML=(d.skills||[]).map(s=>`<div class="sk rv"><div><span>${E(s.name)}</span><span>${+s.level}٪</span></div><div class="bar"><i data-w="${+s.level}"></i></div></div>`).join('');
const c=d.contact||{};
$('#ct').innerHTML=`<div><small>محل سکونت</small>${E(c.address)}</div><a href="tel:${E(c.phone)}"><small>شماره تماس</small>${E(c.phone)}</a><a href="mailto:${E(c.email)}"><small>ایمیل</small>${E(c.email)}</a>`;
$('#ft').textContent=`© ${new Date().getFullYear()} ${d.name} — ${d.nameEn}`;
const ty=[d.title,'Civil Engineer'];let i=0,j=0,del=0;
(function t(){const w=ty[i];$('#ty').textContent=w.slice(0,j);
if(!del&&j++==w.length){del=1;return setTimeout(t,1600)}if(del&&--j==0){del=0;i=(i+1)%ty.length}setTimeout(t,del?45:110)})();
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add('on');
e.target.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%');
e.target.querySelectorAll('[data-n]').forEach(n=>{let v=0,m=+n.dataset.n;const k=setInterval(()=>{v=Math.min(m,v+Math.ceil(m/40));n.textContent=v;if(v>=m)clearInterval(k)},35)});
io.unobserve(e.target)}),{threshold:.2});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
document.addEventListener('click',e=>{if(e.target.matches('.it img,.card img')){$('#lb img').src=e.target.src;$('#lb').classList.add('on')}else $('#lb').classList.remove('on')});
});
</script></body></html>
